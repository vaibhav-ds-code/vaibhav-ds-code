<svg width="880" height="190" viewBox="0 0 880 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hey! I'm Vaibhav - Data Science | ML Enthusiast">
  <defs>
    <pattern id="net" width="70" height="70" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#2ecc71" opacity="0.55"/>
      <circle cx="55" cy="35" r="1.6" fill="#2ecc71" opacity="0.45"/>
      <circle cx="30" cy="58" r="1.6" fill="#2ecc71" opacity="0.5"/>
      <line x1="10" y1="10" x2="55" y2="35" stroke="#2ecc71" stroke-width="0.6" opacity="0.25"/>
      <line x1="55" y1="35" x2="30" y2="58" stroke="#2ecc71" stroke-width="0.6" opacity="0.25"/>
      <line x1="30" y1="58" x2="10" y2="80" stroke="#2ecc71" stroke-width="0.6" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- outer white border -->
  <rect x="2" y="2" width="876" height="186" rx="6" fill="#ffffff"/>
  <!-- inner black panel -->
  <rect x="10" y="10" width="860" height="170" rx="3" fill="#0b0f0c"/>
  <!-- network texture -->
  <rect x="10" y="10" width="860" height="170" rx="3" fill="url(#net)"/>

  <!-- left terminal mascot -->
  <g transform="translate(70,95)">
    <circle cx="0" cy="-34" r="4" fill="#ff4d4d"/>
    <rect x="-28" y="-28" width="56" height="48" rx="9" fill="#4a4a4a" stroke="#6b6b6b" stroke-width="1.5"/>
    <rect x="-20" y="-18" width="40" height="26" rx="3" fill="#111"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#2ecc71">&gt;_</text>
    <rect x="-18" y="22" width="10" height="14" rx="3" fill="#4a4a4a"/>
    <rect x="8" y="22" width="10" height="14" rx="3" fill="#4a4a4a"/>
  </g>

  <!-- right terminal mascot -->
  <g transform="translate(810,95)">
    <circle cx="0" cy="-34" r="4" fill="#ff4d4d"/>
    <rect x="-28" y="-28" width="56" height="48" rx="9" fill="#4a4a4a" stroke="#6b6b6b" stroke-width="1.5"/>
    <rect x="-20" y="-18" width="40" height="26" rx="3" fill="#111"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#2ecc71">&gt;_</text>
    <rect x="-18" y="22" width="10" height="14" rx="3" fill="#4a4a4a"/>
    <rect x="8" y="22" width="10" height="14" rx="3" fill="#4a4a4a"/>
  </g>

  <!-- title -->
  <text x="440" y="90" text-anchor="middle" font-family="'Segoe Script','Comic Sans MS','Brush Script MT',cursive" font-size="40" fill="#ffffff">Hey! I'm Vaibhav</text>
  <!-- subtitle -->
  <text x="440" y="125" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="#2ecc71">Data Science | ML Enthusiast</text>
</svg>
