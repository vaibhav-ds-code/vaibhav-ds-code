<svg width="100%" height="2" viewBox="0 0 1200 2" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="moving rainbow divider">
  <defs>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0" spreadMethod="repeat">
      <stop offset="0%"   stop-color="#FF0000"/>
      <stop offset="16.6%" stop-color="#FF8A00"/>
      <stop offset="33.3%" stop-color="#FFEE00"/>
      <stop offset="50%"  stop-color="#00FF2F"/>
      <stop offset="66.6%" stop-color="#00C3FF"/>
      <stop offset="83.3%" stop-color="#7A00FF"/>
      <stop offset="100%" stop-color="#FF0000"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="240 0" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="2" fill="url(#rainbow)"/>
</svg>
